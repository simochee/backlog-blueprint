name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      - name: Check formatting, lint and types
        run: vp check

      - name: Build
        run: vp run -r build

      - name: Test
        run: vp test

