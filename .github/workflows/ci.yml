name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          cache: true

      - name: Install dependencies
        run: vp install --frozen-lockfile

      # install より前に戻さない。キャッシュは node_modules の下にあり、install が作り直す。
      # キーに lockfile やソースを混ぜない。何が変わったかは Vite Task が自分で見ており、
      # キーが変わると使えたはずのキャッシュまで戻らなくなる。
      - name: Restore the Vite Task cache
        id: vite-task-cache
        uses: actions/cache/restore@v6
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: Check formatting and lint
        run: vp check

      - name: Typecheck
        run: vp run -r typecheck

      - name: Build
        run: vp run -r build

      - name: Test
        run: vp test

      - name: Save the Vite Task cache
        if: success()
        uses: actions/cache/save@v6
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
