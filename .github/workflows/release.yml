name: Release

on:
  push:
    branches:
      - main

permissions: {}

# 並行させない。重なった実行が同じ Pages のデプロイを取り合い、後の側が古いコミットから
# 組んだサイトを公開しうる。
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@simochee/backlog-blueprint"

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      # GITHUB_TOKEN にしない。github-actions[bot] が開いたリリース PR の CI は、誰かが承認するまで
      # 走らない。
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          # `pull-requests: write` だけにしない。release-please はリリース PR のラベルで次の実行が
          # タグ付けを判断し、PR へのラベル付けは issues API を通る。
          permission-issues: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # リリースのときだけに絞らない。Web UI の修正が、CLI を公開する理由ができるまで届かなくなる。
  pages:
    name: Deploy the Web UI
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ブランチを checkout しない。実行中に main へ届いた push が、公開済みの内容に混ざる。
      # タグがあればタグを使う。待たされた実行では main がきっかけのコミットより進んでおり、
      # サイトはリリースと一致しなければならない。
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  publish:
    name: Stage the CLI on npm
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 長期の publish トークンを secret に置かない。npm はこのジョブの OIDC トークンを受け付け、
      # この権限がそれを発行する。
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Enable Corepack
        run: corepack enable

      # `registry-url` を足さない。`_authToken=${NODE_AUTH_TOKEN}` を書いた .npmrc が作られ、
      # その secret が無いここではプレースホルダがそのまま bearer トークンとして送られて、
      # trusted publishing を試す前に 404 で落ちていた（pnpm/pnpm#11526、pnpm 11.1.3 で修正）。
      # registry.npmjs.org は既定値なので、このオプションは認証を奪う方向にしか働かない。
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `publish` にしない。trusted publisher には stage publish しか許しておらず、公開には
      # maintainer の 2FA による承認が要る。GitHub 側の権限を奪われても、それだけでは公開できない。
      - name: Stage
        run: pnpm --filter "${PACKAGE_NAME}" stage publish --access public --no-git-checks
