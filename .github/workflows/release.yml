name: Release

on:
  push:
    branches:
      - main

permissions: {}

# One release at a time: two overlapping runs would race for the same Pages deployment and the
# later one could publish a site assembled from a stale list of schema versions.
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@simochee/backlog-blueprint"
  PAGES_URL: "https://simochee.github.io/backlog-blueprint"

jobs:
  # release-please keeps a pull request open that carries the next version number, derived from the
  # Conventional Commit types on main. Merging that pull request is what decides a release: on the
  # merge the same action tags the commit and creates the GitHub Release.
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # The release pull request is labelled, and that is how the next run recognizes it as its own
      # and knows the release still has to be tagged. Labelling a pull request goes through the
      # issues API, so `pull-requests: write` alone is not enough.
      issues: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The CLI on npm, the Web UI and the JSON Schema on Pages are one release produced from one
  # version number. Publishing the CLI without the matching schema URL on Pages makes editor
  # completion fail silently for everyone on that version, so both halves live in a single job
  # and a failure in either one stops the rest (requirements-definition 7.1).
  #
  # This job cannot be a separate workflow waiting on the tag. A tag created with GITHUB_TOKEN
  # starts no workflow, so `on: push: tags` would never fire for a release-please tag.
  publish:
    name: Publish the CLI and deploy Pages
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The tag release-please just created, not the branch: a push landing on main while this job
      # runs must not become part of the release that was already tagged and announced.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Enable Corepack
        run: corepack enable

      # `registry-url` is deliberately absent. It writes an .npmrc holding
      # `_authToken=${NODE_AUTH_TOKEN}`, and with no such secret here the literal placeholder used
      # to be sent as the bearer token, which the registry answered with 404 before trusted
      # publishing was ever attempted (pnpm/pnpm#11526, fixed in pnpm 11.1.3). registry.npmjs.org
      # is the default anyway, so the option can only take authentication away.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # D-3: a manifest written years ago must keep resolving its $schema URL. The build emits
      # only the version being released and actions/deploy-pages replaces the whole site, so
      # every schema already published is copied back into the artifact before it is uploaded.
      # The npm registry is the list of released versions because the schema version and the
      # CLI version are the same number (D-2).
      - name: Merge previously published schema versions into the site
        run: |
          set -euo pipefail

          error_log="$(mktemp)"
          if ! published="$(npm view "${PACKAGE_NAME}" versions --json 2>"${error_log}")"; then
            # Only "the package does not exist yet" is tolerated, which is the first release.
            # Any other failure is fatal: carrying on with an empty list would silently drop
            # every schema version already on Pages.
            if grep -q "E404" "${error_log}"; then
              echo "${PACKAGE_NAME} has no published version yet; nothing to preserve"
              exit 0
            fi
            cat "${error_log}" >&2
            exit 1
          fi

          echo "${published}" | jq -r 'if type == "array" then .[] else . end' | while read -r version; do
            destination="apps/web/dist/schema/${version}/project.json"
            if [ -e "${destination}" ]; then
              continue
            fi
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --create-dirs \
              --output "${destination}" "${PAGES_URL}/schema/${version}/project.json"
            echo "preserved schema ${version}"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      # Pages goes before npm on purpose. A schema URL that no published CLI mentions yet is
      # harmless, whereas a published CLI whose schema URL is not on Pages breaks completion
      # for its users with no error to see (requirements-definition 7.1). If npm publish fails
      # after this step, re-running the failed jobs of this run rebuilds the same site from the
      # same tag and publishes again.
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

      # npm accepts this job's OIDC token in place of a long-lived publish token, so the
      # repository holds no npm secret at all. `id-token: write` is what mints that token; Pages
      # needs it too, so the job already had it.
      - name: Publish the CLI to npm
        run: pnpm --filter "${PACKAGE_NAME}" publish --access public --no-git-checks
