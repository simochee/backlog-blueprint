name: Release

on:
  push:
    branches:
      - main

permissions: {}

# 並行させない。重なった実行が同じ Pages のデプロイを取り合い、後の側が古いスキーマ版の一覧で
# 組んだサイトを公開しうる。
concurrency:
  group: release
  cancel-in-progress: false

env:
  PACKAGE_NAME: "@simochee/backlog-blueprint"
  PAGES_URL: "https://simochee.github.io/backlog-blueprint"

jobs:
  release-please:
    name: Maintain the release pull request
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.releases_created }}
      tag: ${{ steps.release.outputs['apps/cli--tag_name'] }}
    steps:
      # GITHUB_TOKEN にしない。github-actions[bot] が開いたリリース PR の CI は、誰かが承認するまで
      # 走らない。
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          # `pull-requests: write` だけにしない。release-please はリリース PR のラベルで次の実行が
          # タグ付けを判断し、PR へのラベル付けは issues API を通る。
          permission-issues: write
          permission-pull-requests: write

      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # リリースのときだけに絞らない。Web UI の修正が、CLI を公開する理由ができるまで届かなくなる。
  pages:
    name: Deploy the Web UI and the JSON Schema
    needs: release-please
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # ブランチを checkout しない。実行中に main へ届いた push が、公開済みの内容に混ざる。
      # タグがあればタグを使う。待たされた実行では main がきっかけのコミットより進んでおり、
      # サイトはリリースと一致しなければならない。
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag || github.sha }}

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # 省かない。actions/deploy-pages はサイトを丸ごと置き換え、公開済みの $schema の URL が
      # 解決できなくなる（D-3）。新しいビルドを優先させもしない。理由は DEVELOPMENT.md の
      # "What the workflow has to guarantee"。
      - name: Restore the schema of every published version
        run: |
          set -euo pipefail

          error_log="$(mktemp)"
          if ! published="$(npm view "${PACKAGE_NAME}" versions --json 2>"${error_log}")"; then
            # 初回リリース（パッケージが未公開）以外の失敗を許さない。空の一覧で続けると、
            # Pages にある公開済みのスキーマが黙って全部消える。
            if grep -q "E404" "${error_log}"; then
              echo "${PACKAGE_NAME} has no published version yet; nothing to restore"
              exit 0
            fi
            cat "${error_log}" >&2
            exit 1
          fi

          # 0.0.0 を取りに行かない。trusted publisher の設定画面を作るためだけに手で公開した版で、
          # Pages にスキーマが無く、取得の 404 でデプロイが毎回落ちる。
          echo "${published}" | jq -r '(if type == "array" then .[] else . end) | select(. != "0.0.0")' | while read -r version; do
            curl --fail --silent --show-error --retry 3 --retry-delay 5 --create-dirs \
              --output "apps/web/dist/schema/${version}/project.json" \
              "${PAGES_URL}/schema/${version}/project.json"
            echo "restored schema ${version}"
          done

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5

  # `needs: pages` を外さない。スキーマの URL が未デプロイの CLI を公開すると、エディタの補完が
  # 黙って効かなくなる（要件定義 §7.1）。`push: tags` の別ワークフローにもしない。ワークフローを
  # またぐと、`needs` で Pages のデプロイを待てない。
  publish:
    name: Stage the CLI on npm
    needs: [release-please, pages]
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 長期の publish トークンを secret に置かない。npm はこのジョブの OIDC トークンを受け付け、
      # この権限がそれを発行する。
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}

      - name: Enable Corepack
        run: corepack enable

      # `registry-url` を足さない。`_authToken=${NODE_AUTH_TOKEN}` を書いた .npmrc が作られ、
      # その secret が無いここではプレースホルダがそのまま bearer トークンとして送られて、
      # trusted publishing を試す前に 404 で落ちていた（pnpm/pnpm#11526、pnpm 11.1.3 で修正）。
      # registry.npmjs.org は既定値なので、このオプションは認証を奪う方向にしか働かない。
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `publish` にしない。trusted publisher には stage publish しか許しておらず、公開には
      # maintainer の 2FA による承認が要る。GitHub 側の権限を奪われても、それだけでは公開できない。
      - name: Stage
        run: pnpm --filter "${PACKAGE_NAME}" stage publish --access public --no-git-checks
